'use strict';
/* ==========================================================================
 * battle.js — Turn-Based RPG Battle & Critter Capture Engine
 * Integrates Hero Passive Perks, Fancy Tool Bonuses (Prism Staff, Magnet),
 * Type Effectiveness, Level-Gap Dampener, Input/Submenu Locks, Timer Cleanup,
 * Live Language Refresh & Canvas VFX.
 * ========================================================================== */
const Battle = (() => {
  const getD = () => (typeof GameData !== 'undefined' ? GameData : globalThis.GameData);
  let active = false;
  let state = null;
  let wild = null;
  let isBoss = false;
  let chapterId = 1;
  let busy = false;
  let menuOpen = false;
  let currentSubmenu = null; // 'orb' | 'switch' | null
  let victoryTriggered = false;
  let fedCount = 0;
  let shieldActive = false;
  let onEndCb = null;
  let lastMsgSpec = null;

  // Timer & animation tracking
  const pendingTimers = new Set();
  let rafId = null;
  let animTime = 0;
  let wildOffset = { x: 0, y: 0, shake: 0 };
  let mineOffset = { x: 0, y: 0, shake: 0 };
  let orbAnim = null; // { t, color, rainbow }
  let fxList = [];

  const $ = id => (typeof document !== 'undefined' ? document.getElementById(id) : null);

  function scheduleTimer(fn, ms) {
    const id = setTimeout(() => {
      pendingTimers.delete(id);
      if (!active) return;
      fn();
    }, ms);
    pendingTimers.add(id);
    return id;
  }

  function clearPendingTimers() {
    pendingTimers.forEach(id => clearTimeout(id));
    pendingTimers.clear();
  }

  function levelGapMult(atkLv, defLv) {
    const diff = (atkLv || 1) - (defLv || 1);
    return Math.max(0.78, Math.min(1.25, 1 + diff * 0.03));
  }

  function calcStats(critterId, lv, isPlayerTeam, stateOverride) {
    const D = getD();
    const stObj = stateOverride || state;
    const base = D.CRITTER_BY_ID[critterId] || D.CRITTERS[0];
    let hpMult = 1, atkMult = 1;
    if (isPlayerTeam && stObj) {
      const hero = D.HERO_BY_ID[stObj.heroId];
      if (hero && hero.perk) {
        if (hero.perk.hpMult) hpMult *= hero.perk.hpMult;
        if (hero.perk.atkMult) atkMult *= hero.perk.atkMult;
      }
    }
    const maxHp = Math.round((base.hp + lv * 6) * hpMult);
    const atk = Math.round((base.atk + lv * 2.15) * atkMult);
    const spd = Math.round(base.spd + lv * 1.3);
    return { maxHp, atk, spd };
  }

  function calcPlayerDamage(mine, wildObj, stObj, rng) {
    const D = getD();
    const mCr = D.CRITTER_BY_ID[mine.id] || D.CRITTERS[0];
    const wCr = D.CRITTER_BY_ID[wildObj.id] || D.CRITTERS[0];
    const mst = calcStats(mine.id, mine.lv, true, stObj);
    let mult = D.typeMultiplier(mCr.elem, wCr.elem);
    const hero = stObj ? D.HERO_BY_ID[stObj.heroId] : null;
    if (hero && hero.perk && hero.perk.elemBonus && hero.perk.elemBonus.includes(mCr.elem)) {
      mult *= hero.perk.elemMult;
    }
    const gap = levelGapMult(mine.lv, wildObj.lv);
    const roll = 0.90 + (typeof rng === 'function' ? rng() : Math.random()) * 0.25;
    const dmg = Math.max(4, Math.round(mst.atk * mult * gap * roll));
    return { dmg, mult };
  }

  function calcEnemyDamage(wildObj, mine, shielded, rng) {
    const D = getD();
    const mCr = D.CRITTER_BY_ID[mine.id] || D.CRITTERS[0];
    const wCr = D.CRITTER_BY_ID[wildObj.id] || D.CRITTERS[0];
    const mult = D.typeMultiplier(wCr.elem, mCr.elem);
    const gap = levelGapMult(wildObj.lv, mine.lv);
    const roll = 0.72 + (typeof rng === 'function' ? rng() : Math.random()) * 0.20;
    let dmg = Math.max(3, Math.round(wildObj.atk * mult * gap * roll));
    if (shielded) dmg = Math.max(1, Math.round(dmg * 0.45));
    return { dmg, mult };
  }

  function getActiveMine() {
    let p = state.party[state.activePartnerIdx] || state.party[0];
    if (!p || p.hp <= 0) {
      const aliveIdx = state.party.findIndex(x => x.hp > 0);
      if (aliveIdx >= 0) {
        state.activePartnerIdx = aliveIdx;
        p = state.party[aliveIdx];
      }
    }
    return p;
  }

  function getCatchChance(orbMult) {
    const D = getD();
    const base = D.CRITTER_BY_ID[wild.id].catchBase;
    const hpRatio = Math.max(0, wild.hp / wild.maxHp);
    const hpBonus = (1 - hpRatio) * 0.42;
    const feedBonus = Math.min(0.45, fedCount * 0.25);
    const hero = D.HERO_BY_ID[state.heroId];
    const heroBonus = (hero && hero.perk && hero.perk.catchBonus) ? hero.perk.catchBonus : 0;
    const toolBonus = state.tools.includes('prismstaff') ? 0.25 : 0;
    const raw = (base + hpBonus + feedBonus + heroBonus + toolBonus) * (orbMult || 1);
    return Math.max(0.08, Math.min(0.98, raw));
  }

  function closeSubmenu() {
    menuOpen = false;
    currentSubmenu = null;
    const sub = $('bSub');
    if (sub) {
      sub.classList.add('hidden');
      sub.innerHTML = '';
    }
    const acts = $('bActions');
    if (acts) acts.classList.remove('hidden');
  }

  function renderMsgSpec(spec) {
    if (!spec) return '';
    const D = getD();
    const vars = {};
    if (spec.vars) {
      Object.keys(spec.vars).forEach(k => {
        const v = spec.vars[k];
        if (v && typeof v === 'object' && v.critterNameId) {
          const cr = D.CRITTER_BY_ID[v.critterNameId] || D.CRITTERS[0];
          vars[k] = I18N.pick(cr.name);
        } else if (v && typeof v === 'object' && v.critterSkillId) {
          const cr = D.CRITTER_BY_ID[v.critterSkillId] || D.CRITTERS[0];
          vars[k] = I18N.pick(cr.skill);
        } else if (v && typeof v === 'object' && v.i18nKey) {
          vars[k] = I18N.t(v.i18nKey);
        } else {
          vars[k] = v;
        }
      });
    }
    let txt = I18N.t(spec.key, vars);
    if (spec.extraKey) txt += I18N.t(spec.extraKey);
    return txt;
  }

  function setMsgKey(key, vars, extraKey) {
    lastMsgSpec = { key, vars: vars || null, extraKey: extraKey || null };
    const el = $('bMsg');
    if (el) el.textContent = renderMsgSpec(lastMsgSpec);
  }

  function start(gameState, critterId, lv, bossFlag, chId, onEnd) {
    clearPendingTimers();
    if (rafId && typeof cancelAnimationFrame === 'function') {
      cancelAnimationFrame(rafId);
      rafId = null;
    }

    const D = getD();
    state = gameState;
    isBoss = !!bossFlag;
    chapterId = chId || 1;
    onEndCb = onEnd;
    fedCount = 0;
    busy = false;
    menuOpen = false;
    currentSubmenu = null;
    victoryTriggered = false;
    orbAnim = null;
    fxList = [];

    const hero = D.HERO_BY_ID[state.heroId];
    shieldActive = !!(hero && hero.perk && hero.perk.startShield);

    const st = calcStats(critterId, lv, false);
    const bossHpMult = isBoss ? 1.15 : 1.0;
    wild = {
      id: critterId,
      lv,
      maxHp: Math.round(st.maxHp * bossHpMult),
      hp: Math.round(st.maxHp * bossHpMult),
      atk: st.atk,
      spd: st.spd,
    };

    // Ensure partner stats are synced
    const mine = getActiveMine();
    const mst = calcStats(mine.id, mine.lv, true);
    mine.maxHp = mst.maxHp;
    mine.hp = Math.min(mine.maxHp, mine.hp);

    active = true;
    const bEl = $('battle');
    if (bEl) bEl.classList.remove('hidden');
    closeSubmenu();
    AudioFX.playBgm('battle');

    setMsgKey(isBoss ? 'battleBossAppeared' : 'battleWildAppeared', {
      name: { critterNameId: wild.id },
      lv: wild.lv,
    });
    syncUI();
    startLoop();
  }

  function syncUI() {
    if (!active || !wild || !state) return;
    const D = getD();
    const wCr = D.CRITTER_BY_ID[wild.id];
    const mine = getActiveMine();
    const mCr = D.CRITTER_BY_ID[mine.id];

    const setTxt = (id, t) => { const el = $(id); if (el) el.textContent = t; };
    const setW = (id, pct) => { const el = $(id); if (el && el.style) el.style.width = pct; };

    setTxt('bwName', I18N.pick(wCr.name));
    setTxt('bwLv', 'Lv.' + wild.lv);
    setTxt('bwBadge', isBoss ? '👑 BOSS' : (I18N.t('elemNames')[wCr.elem] || wCr.elem));
    setW('bwHp', Math.max(0, Math.round((wild.hp / wild.maxHp) * 100)) + '%');
    setTxt('bwHpTxt', `${wild.hp}/${wild.maxHp}`);
    const chancePct = Math.round(getCatchChance(1.0) * 100);
    setW('bwCatch', chancePct + '%');
    setTxt('bwCatchTxt', `🎯 ${I18N.t('catchChance')} ${chancePct}%`);

    setTxt('bmName', I18N.pick(mCr.name) + (shieldActive ? ' 🛡️' : ''));
    setTxt('bmLv', 'Lv.' + mine.lv);
    setW('bmHp', Math.max(0, Math.round((mine.hp / mine.maxHp) * 100)) + '%');
    setTxt('bmHpTxt', `${mine.hp}/${mine.maxHp}`);
    const needExp = mine.lv * 30;
    setW('bmExp', Math.min(100, Math.round((mine.exp / needExp) * 100)) + '%');

    // Button labels
    setTxt('bAttackLabel', I18N.t('attack'));
    setTxt('bMoveName', I18N.pick(mCr.skill));
    setTxt('bCatchLabel', I18N.t('catchBtn'));
    setTxt('bCatchInfo', `🔵${state.items.orbs} 🌈${state.items.superOrbs} 👑${state.items.masterOrbs}`);
    setTxt('bFeedLabel', I18N.t('feedBtn'));
    setTxt('bFeedInfo', `🍓×${state.items.treats} · ${I18N.t('feedInfo')}`);
    setTxt('bSwitchLabel', I18N.t('switchRun'));
    setTxt('bSwitchInfo', I18N.t('switchInfo'));
    setTxt('bLangBtn', '🌐 ' + I18N.t('langLabel'));
  }

  function refreshLang() {
    if (!active) return;
    if (lastMsgSpec) {
      const el = $('bMsg');
      if (el) el.textContent = renderMsgSpec(lastMsgSpec);
    }
    syncUI();
    if (currentSubmenu === 'orb') openOrbMenu();
    else if (currentSubmenu === 'switch') openSwitchMenu();
  }

  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < (count || 14); i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.5 + Math.random() * 4;
      fxList.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 1, color, r: 3 + Math.random() * 4 });
    }
  }

  function startLoop() {
    const cv = $('battleCanvas');
    if (!cv || typeof cv.getContext !== 'function' || typeof requestAnimationFrame !== 'function') return;
    if (rafId && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(rafId);
    const c = cv.getContext('2d');
    if (!c) return;
    const tick = () => {
      if (!active) return;
      animTime += 0.016;
      const rect = cv.parentElement && cv.parentElement.getBoundingClientRect
        ? cv.parentElement.getBoundingClientRect()
        : { width: 480, height: 280 };
      const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
      const w = Math.max(300, Math.floor(rect.width));
      const h = Math.max(200, Math.floor(rect.height));
      if (cv.width !== w * dpr || cv.height !== h * dpr) {
        cv.width = w * dpr; cv.height = h * dpr;
      }
      c.save();
      c.scale(dpr, dpr);

      const skyColors = {
        1: ['#7dd3fc', '#bbf7d0', '#4ade80'],
        2: ['#38bdf8', '#a5f3fc', '#fde68a'],
        3: ['#fb923c', '#fde68a', '#eab308'],
        4: ['#60a5fa', '#e0f2fe', '#bae6fd'],
        5: ['#312e81', '#7e22ce', '#e9d5ff'],
      }[chapterId] || ['#7dd3fc', '#bbf7d0', '#4ade80'];

      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, skyColors[0]);
      g.addColorStop(0.58, skyColors[1]);
      g.addColorStop(1, skyColors[2]);
      c.fillStyle = g;
      c.fillRect(0, 0, w, h);

      const wx = w * 0.72, wy = h * 0.44;
      const mx = w * 0.27, my = h * 0.72;
      c.fillStyle = 'rgba(255,255,255,0.42)';
      c.beginPath(); c.ellipse(wx, wy + 46, 68, 20, 0, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(mx, my + 42, 74, 22, 0, 0, Math.PI * 2); c.fill();

      wildOffset.x *= 0.85; wildOffset.y *= 0.85; wildOffset.shake *= 0.85;
      mineOffset.x *= 0.85; mineOffset.y *= 0.85; mineOffset.shake *= 0.85;
      const wShake = wildOffset.shake > 0.3 ? (Math.random() - 0.5) * wildOffset.shake * 14 : 0;
      const mShake = mineOffset.shake > 0.3 ? (Math.random() - 0.5) * mineOffset.shake * 14 : 0;

      const wildSize = Math.min(138, h * 0.48);
      Art.drawCritter(c, wild.id, wx + wildOffset.x + wShake, wy + wildOffset.y, wildSize, animTime, false);

      const mine = getActiveMine();
      if (mine) {
        const mineSize = Math.min(132, h * 0.46);
        Art.drawCritter(c, mine.id, mx + mineOffset.x + mShake, my + mineOffset.y, mineSize, animTime + 1.2, true);
      }

      if (orbAnim) {
        orbAnim.t += 0.04;
        const p = Math.min(1, orbAnim.t);
        const ox = mx + (wx - mx) * p;
        const oy = my + (wy - my) * p - Math.sin(p * Math.PI) * 90;
        if (orbAnim.rainbow) {
          c.strokeStyle = `hsl(${(animTime * 360) % 360}, 90%, 65%)`;
          c.lineWidth = 6;
          c.beginPath(); c.moveTo(mx + 20, my - 10); c.lineTo(ox, oy); c.stroke();
        }
        c.fillStyle = orbAnim.color;
        c.beginPath(); c.arc(ox, oy, 12, 0, Math.PI * 2); c.fill();
        c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.stroke();
        if (p >= 1) orbAnim = null;
      }

      for (let i = fxList.length - 1; i >= 0; i--) {
        const f = fxList[i];
        f.x += f.vx; f.y += f.vy; f.life -= 0.032;
        if (f.life <= 0) { fxList.splice(i, 1); continue; }
        c.globalAlpha = f.life;
        c.fillStyle = f.color;
        c.beginPath(); c.arc(f.x, f.y, f.r, 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
      c.restore();
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  }

  function handleAction(act) {
    if (!active || busy || menuOpen) return;
    AudioFX.sfx.tap();
    if (act === 'attack') return doAttack();
    if (act === 'catch') return openOrbMenu();
    if (act === 'feed') return doFeed();
    if (act === 'switch') return openSwitchMenu();
  }

  function doAttack() {
    if (!active || busy) return;
    closeSubmenu();
    busy = true;
    const D = getD();
    const mine = getActiveMine();
    const mCr = D.CRITTER_BY_ID[mine.id];
    const { dmg, mult } = calcPlayerDamage(mine, wild, state);

    mineOffset.x = 34; mineOffset.y = -18;
    wildOffset.shake = 1.0;
    wild.hp = Math.max(0, wild.hp - dmg);
    const cv = $('battleCanvas');
    if (cv) spawnParticles((cv.clientWidth || 400) * 0.72, (cv.clientHeight || 240) * 0.44, mCr.art.accent, 18);
    if (mult > 1.15) AudioFX.sfx.superHit(); else AudioFX.sfx.hit();

    const extraKey = mult > 1.15 ? 'battleSuperEffective' : (mult < 0.9 ? 'battleNotEffective' : null);
    setMsgKey('battleUsedSkill', {
      a: { critterNameId: mine.id },
      skill: { critterSkillId: mine.id },
      dmg,
    }, extraKey);
    syncUI();

    scheduleTimer(() => {
      if (wild.hp <= 0) return finishVictory(false);
      enemyTurn();
    }, 850);
  }

  function openOrbMenu() {
    if (!active || busy) return;
    const sub = $('bSub');
    if (!sub) return;
    const total = state.items.orbs + state.items.superOrbs + state.items.masterOrbs;
    if (total <= 0) {
      setMsgKey('battleNoOrbs');
      return;
    }
    menuOpen = true;
    currentSubmenu = 'orb';
    const items = [
      { key: 'orbs', label: `🔵 ${I18N.t('orbs')} (×${state.items.orbs})`, mult: 1.0, color: '#38bdf8' },
      { key: 'superOrbs', label: `🌈 ${I18N.t('superOrbs')} (×${state.items.superOrbs})`, mult: 1.6, color: '#ec4899' },
      { key: 'masterOrbs', label: `👑 ${I18N.t('masterOrbs')} (×${state.items.masterOrbs})`, mult: 99, color: '#facc15' },
    ];
    sub.innerHTML = items.map(it => {
      const pct = it.mult >= 99 ? 100 : Math.round(getCatchChance(it.mult) * 100);
      return `<button class="bsub-btn" data-orb="${it.key}" ${state.items[it.key] <= 0 ? 'disabled' : ''}>${it.label} · <b>${pct}%</b></button>`;
    }).join('') + `<button class="bsub-btn cancel" data-cancel="1">${I18N.t('close')}</button>`;
    sub.classList.remove('hidden');
    const acts = $('bActions');
    if (acts) acts.classList.add('hidden');
    sub.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        if (!active || busy) return;
        closeSubmenu();
        if (btn.dataset.cancel) return;
        const spec = items.find(x => x.key === btn.dataset.orb);
        if (spec && state.items[spec.key] > 0) doThrowOrb(spec);
      };
    });
  }

  function doThrowOrb(spec) {
    if (!active || busy) return;
    busy = true;
    state.items[spec.key]--;
    AudioFX.sfx.throwOrb();
    orbAnim = { t: 0, color: spec.color, rainbow: state.tools.includes('prismstaff') };
    setMsgKey('battleThrowOrb', { orb: { i18nKey: spec.key } });
    syncUI();

    scheduleTimer(() => {
      const chance = spec.mult >= 99 ? 1.0 : getCatchChance(spec.mult);
      const caught = Math.random() < chance;
      const cv = $('battleCanvas');
      if (caught) {
        AudioFX.sfx.catchOk();
        if (cv) spawnParticles((cv.clientWidth || 400) * 0.72, (cv.clientHeight || 240) * 0.44, '#fde047', 30);
        setMsgKey('battleCaught', { name: { critterNameId: wild.id } });
        scheduleTimer(() => finishVictory(true), 850);
      } else {
        setMsgKey('battleBrokeFree', { name: { critterNameId: wild.id } });
        scheduleTimer(() => enemyTurn(), 900);
      }
    }, 800);
  }

  function doFeed() {
    if (!active || busy) return;
    if (state.items.treats <= 0) {
      setMsgKey('battleNoTreats');
      return;
    }
    closeSubmenu();
    busy = true;
    const D = getD();
    state.items.treats--;
    fedCount++;
    const mine = getActiveMine();
    const hero = D.HERO_BY_ID[state.heroId];
    const healRatio = 0.32 + ((hero && hero.perk && hero.perk.healBonus) ? hero.perk.healBonus : 0);
    mine.hp = Math.min(mine.maxHp, mine.hp + Math.round(mine.maxHp * healRatio));
    AudioFX.sfx.heal();
    const cv = $('battleCanvas');
    if (cv) spawnParticles((cv.clientWidth || 400) * 0.72, (cv.clientHeight || 240) * 0.44, '#f472b6', 16);
    setMsgKey('battleFed', { name: { critterNameId: wild.id } });
    syncUI();
    scheduleTimer(() => enemyTurn(), 850);
  }

  function openSwitchMenu() {
    if (!active || busy) return;
    const sub = $('bSub');
    if (!sub) return;
    const D = getD();
    menuOpen = true;
    currentSubmenu = 'switch';
    let html = state.party.map((p, idx) => {
      const cr = D.CRITTER_BY_ID[p.id];
      const cur = idx === state.activePartnerIdx;
      return `<button class="bsub-btn" data-swap="${idx}" ${cur || p.hp <= 0 ? 'disabled' : ''}>${I18N.pick(cr.name)} Lv.${p.lv} (${p.hp}/${p.maxHp})</button>`;
    }).join('');
    html += `<button class="bsub-btn run" data-run="1">🏃 ${I18N.getLang() === 'zh' ? '逃跑' : 'Run Away'}</button>`;
    html += `<button class="bsub-btn cancel" data-cancel="1">${I18N.t('close')}</button>`;
    sub.innerHTML = html;
    sub.classList.remove('hidden');
    const acts = $('bActions');
    if (acts) acts.classList.add('hidden');
    sub.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        if (!active || busy) return;
        closeSubmenu();
        if (btn.dataset.cancel) return;
        if (btn.dataset.run) {
          if (isBoss) { setMsgKey('battleRunBoss'); AudioFX.sfx.locked(); return; }
          busy = true;
          setMsgKey('battleRunOk');
          scheduleTimer(() => endBattle({ result: 'run' }), 500);
          return;
        }
        const idx = parseInt(btn.dataset.swap, 10);
        if (!isNaN(idx) && state.party[idx] && state.party[idx].hp > 0 && idx !== state.activePartnerIdx) {
          state.activePartnerIdx = idx;
          syncUI();
          busy = true;
          scheduleTimer(() => enemyTurn(), 500);
        }
      };
    });
  }

  function enemyTurn() {
    if (!active) return;
    const D = getD();
    const mine = getActiveMine();
    const wCr = D.CRITTER_BY_ID[wild.id];
    const { dmg } = calcEnemyDamage(wild, mine, shieldActive);
    if (shieldActive) shieldActive = false;

    wildOffset.x = -34; wildOffset.y = 18;
    mineOffset.shake = 1.0;
    mine.hp = Math.max(0, mine.hp - dmg);
    AudioFX.sfx.hit();
    const cv = $('battleCanvas');
    if (cv) spawnParticles((cv.clientWidth || 400) * 0.27, (cv.clientHeight || 240) * 0.72, wCr.art.c1, 14);
    setMsgKey('battleUsedSkill', {
      a: { critterNameId: wild.id },
      skill: { critterSkillId: wild.id },
      dmg,
    });
    syncUI();

    scheduleTimer(() => {
      if (mine.hp <= 0) {
        const nextIdx = state.party.findIndex(x => x.hp > 0);
        if (nextIdx >= 0) {
          state.activePartnerIdx = nextIdx;
          setMsgKey('battleFainted', { name: { critterNameId: mine.id } });
          syncUI();
          busy = false;
        } else {
          setMsgKey('battleAllFainted');
          scheduleTimer(() => endBattle({ result: 'fainted' }), 1100);
        }
      } else {
        busy = false;
      }
    }, 850);
  }

  function finishVictory(caught) {
    if (!active || victoryTriggered) return;
    victoryTriggered = true;
    busy = true;
    closeSubmenu();
    const D = getD();
    const hero = D.HERO_BY_ID[state.heroId];
    const expMult = (hero && hero.perk && hero.perk.expMult) ? hero.perk.expMult : 1;
    let goldMult = (hero && hero.perk && hero.perk.goldMult) ? hero.perk.goldMult : 1;
    if (state.tools.includes('magnet')) goldMult *= 1.35;

    const alreadyDefeatedBoss = isBoss && (
      (Array.isArray(state.defeatedBosses) && state.defeatedBosses.includes(chapterId)) ||
      (Array.isArray(state.crests) && state.crests.includes(chapterId))
    );

    const expGain = alreadyDefeatedBoss ? 0 : Math.round((16 + wild.lv * 6) * (isBoss ? 2.5 : 1) * expMult);
    const goldGain = alreadyDefeatedBoss ? 0 : Math.round((12 + wild.lv * 4) * (isBoss ? 3.5 : 1) * goldMult);
    state.gold += goldGain;

    const mine = getActiveMine();
    mine.exp += expGain;
    let leveledUp = false;
    while (mine.exp >= mine.lv * 30 && mine.lv < 50) {
      mine.exp -= mine.lv * 30;
      mine.lv++;
      const nst = calcStats(mine.id, mine.lv, true);
      mine.maxHp = nst.maxHp;
      mine.hp = nst.maxHp;
      leveledUp = true;
    }
    if (leveledUp) AudioFX.sfx.levelUp();

    if (alreadyDefeatedBoss) {
      setMsgKey('battleWinRematch');
    } else {
      setMsgKey('battleWin', { exp: expGain, gold: goldGain });
    }
    syncUI();

    scheduleTimer(() => {
      endBattle({
        result: caught ? 'caught' : 'win',
        critterId: wild.id,
        lv: wild.lv,
        isBoss,
        chapterId,
        expGain,
        goldGain,
        leveledUp,
        rematch: alreadyDefeatedBoss,
      });
    }, 1000);
  }

  function endBattle(info) {
    if (!active) return;
    active = false;
    busy = true;
    clearPendingTimers();
    closeSubmenu();
    if (rafId && typeof cancelAnimationFrame === 'function') {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    const bEl = $('battle');
    if (bEl) bEl.classList.add('hidden');
    const cb = onEndCb;
    onEndCb = null;
    if (cb) cb(info);
  }

  function isActive() { return active; }
  function isBusy() { return busy; }
  function isMenuOpen() { return menuOpen; }
  function getWild() { return wild; }

  return {
    start,
    handleAction,
    refreshLang,
    isActive,
    isBusy,
    isMenuOpen,
    getWild,
    calcStats,
    calcPlayerDamage,
    calcEnemyDamage,
    levelGapMult,
    endBattle,
  };
})();
if (typeof globalThis !== 'undefined') globalThis.Battle = Battle;
if (typeof module === 'object' && module.exports) module.exports = Battle;

/* ==========================================================================
 * ui.js — Modals: Interactive World Map, Reward Vault (Chapters/Heroes/Tools),

 * ========================================================================== */
const UI = (() => {

  let gameRef = null;
  let storeTab = 'chapters';
  let activeModal = null; // { type, arg }
  let pendingAdCancel = null;
  let resetConfirmStep = false;

  function bind(ref) {
    gameRef = ref;

  function openModal(title, html, onReady, modalMeta) {
    activeModal = modalMeta || null;
    if (pendingAdCancel && (!modalMeta || modalMeta.type !== 'simAd')) {
      const cancel = pendingAdCancel;
      pendingAdCancel = null;
      cancel('cancelled');
    }
    const titleEl = $('modalTitle');
    const bodyEl = $('modalBody');
    const modalEl = $('modal');
    const langBtn = $('modalLangBtn');
    if (titleEl) titleEl.textContent = title;

    if (bodyEl) bodyEl.innerHTML = html;
    if (modalEl) modalEl.classList.remove('hidden');

  function closeModal() {
    activeModal = null;
    resetConfirmStep = false;
    const modalEl = $('modal');
    if (modalEl) modalEl.classList.add('hidden');
    if (pendingAdCancel) {
      const cancel = pendingAdCancel;
      pendingAdCancel = null;
      cancel('cancelled');
    }
  }

  function refreshActiveModal() {
    const modalEl = $('modal');
    if (!activeModal || !modalEl || modalEl.classList.contains('hidden')) return;
    const { type, arg } = activeModal;
    if (type === 'worldMap') openWorldMap();
    else if (type === 'store') openStore(storeTab);
    else if (type === 'gate') openGateLockModal(arg);
    else if (type === 'dex') openDex();
    else if (type === 'party') openParty();
    else if (type === 'bag') openBag();
    else if (type === 'settings') openSettings();
    else if (type === 'simAd' && arg) {
      const { prod, onComplete, onSkip } = arg;
      openSimulatedAdModal(prod, onComplete, onSkip);
    }
  }

  /* ---------------- Bundle Ownership & Cross-Credited Ad Progress ---------------- */
  function getEffectiveAdProgress(prod, st) {
    if (!prod || prod.repeatable) return 0;
    const prog = (st && st.adProgress) || {};
    let total = prog[prod.id] || 0;
    if (Array.isArray(prod.creditFrom)) {
      prod.creditFrom.forEach(srcId => {
        total += (prog[srcId] || 0);
      });
    }
    return Math.min(prod.adCost || 1, total);
  }

  function isProductOwned(p, st) {
    if (!p || p.repeatable) return false;
    if (p.isBundle) {
      return Array.isArray(st.claimedBundles) && st.claimedBundles.includes(p.id);
    }
    const g = p.grants || {};
    const chOk = !g.chapters || g.chapters.every(cid => st.unlockedChapters.includes(cid));
    const heroOk = !g.heroes || g.heroes.every(hid => st.unlockedHeroes.includes(hid));
    const toolOk = !g.tools || g.tools.every(tid => st.tools.includes(tid));
    return chOk && heroOk && toolOk;
  }

  function adBtnLabel(prod, st) {
    if (Platform.isRewardedAdInFlight()) return I18N.t('storeAdLoading');
    if (prod.repeatable || prod.adCost === 1) return I18N.t('storeWatchAdSingle');
    const done = getEffectiveAdProgress(prod, st);
    return I18N.t('storeWatchAd', { done, cost: prod.adCost });
  }

  /* ---------------- 1. Interactive World Map & Chapter Navigator ---------------- */
  function openWorldMap() {
    const D = getD();
    const st = gameRef.getState();
    const hasWings = st.tools.includes('wings');
    const chCards = D.CHAPTERS.map(ch => {
      const unlocked = st.unlockedChapters.includes(ch.id);
      const cleared = st.crests.includes(ch.id);
      const prod = ch.productId ? D.PRODUCT_BY_ID[ch.productId] : null;
      const done = prod ? getEffectiveAdProgress(prod, st) : 0;
      const badge = ch.free
        ? `<span class="badge free">${I18N.t('chapterFree')}</span>`
        : unlocked
          ? `<span class="badge owned">${I18N.t('chapterUnlocked')}</span>`
          : `<span class="badge paid">🎬 ${done}/${ch.adCost}</span>`;
      const actionBtn = !unlocked
        ? `<button class="sm-btn gold" data-unlock-ch="${ch.productId}">${I18N.t('openStoreBtn')}</button>`
        : hasWings
          ? `<button class="sm-btn primary" data-warp="${ch.id}">🪽 ${I18N.t('fastTravelBtn')}</button>`
          : `<button class="sm-btn ghost" data-need-wings="1">🪽 ${I18N.t('unlockWingsBtn')}</button>`;
      return `
        <div class="ch-row ${unlocked ? '' : 'locked'}">
          <div class="ch-row-top">
            <div><strong>${ch.emoji} ${I18N.t('chapterPrefix', { n: ch.id })} · ${I18N.pick(ch.short)}</strong> ${badge} ${cleared ? `<span class="badge clear">🏆 ${I18N.t('chapterCleared')}</span>` : ''}</div>
            ${actionBtn}
          </div>
          <p class="ch-desc">${I18N.pick(ch.desc)}</p>
        </div>`;
    }).join('');

    const tip = hasWings
      ? `🪽 ${I18N.getLang() === 'zh' ? '已装备星穹之翼！点击任意已解锁章节即可一键瞬移！' : 'Aether Wings active! Jump to any unlocked chapter instantly!'}`
      : `🗺️ ${I18N.t('fastTravelLocked')}`;

    openModal(`🗺️ ${I18N.t('worldMap')}`, `
      <div class="wmap-wrap"><canvas id="worldMapCanvas"></canvas></div>
      <div class="info-banner">${tip}</div>
      <div class="ch-list">${chCards}</div>
    `, body => {
      const cv = body.querySelector('#worldMapCanvas');
      const pos = gameRef.getOverworldPos();
      if (cv) Art.renderWorldMapCanvas(cv, pos.x, pos.y, st);

      body.querySelectorAll('[data-warp]').forEach(btn => {
        btn.onclick = () => {
          const cid = parseInt(btn.dataset.warp, 10);
          closeModal();
          gameRef.warpToChapter(cid);
        };
      });
      body.querySelectorAll('[data-need-wings]').forEach(btn => {
        btn.onclick = () => {
          gameRef.toast(I18N.t('fastTravelLocked'));
          openStore('tools');
        };
      });
      body.querySelectorAll('[data-unlock-ch]').forEach(btn => {
        btn.onclick = () => {
          storeTab = 'chapters';
          openStore('chapters');
        };
      });
    }, { type: 'worldMap' });
  }

  /* ---------------- 2. Reward Vault (IAA Ad Unlocks + Gold Supplies) ---------------- */
  function openStore(tab) {
    const D = getD();
    if (tab) storeTab = tab;
    const st = gameRef.getState();
    const adBusy = Platform.isRewardedAdInFlight();

    const tabsHtml = `
      <div class="tabs">
        <button class="tab-btn ${storeTab === 'chapters' ? 'active' : ''}" data-tab="chapters">🗺️ ${I18N.t('storeTabChapters')}</button>
        <button class="tab-btn ${storeTab === 'heroes' ? 'active' : ''}" data-tab="heroes">🦸 ${I18N.t('storeTabHeroes')}</button>
        <button class="tab-btn ${storeTab === 'tools' ? 'active' : ''}" data-tab="tools">✨ ${I18N.t('storeTabTools')}</button>
        <button class="tab-btn ${storeTab === 'items' ? 'active' : ''}" data-tab="items">🎁 ${I18N.t('storeTabItems')}</button>
      </div>
      <div class="wechat-note">🎬 ${I18N.t('storeWechatNote')}</div>
      <div class="store-grid" id="storeGrid"></div>
    `;

    openModal(I18N.t('storeTitle'), tabsHtml, body => {
      body.querySelectorAll('[data-tab]').forEach(b => {
        b.onclick = () => openStore(b.dataset.tab);
      });
      const grid = body.querySelector('#storeGrid');

      if (storeTab === 'chapters') {
        const freeList = D.CHAPTERS.filter(c => c.free)
          .map(c => `${c.emoji} ${I18N.t('chapterPrefix', { n: c.id })} ${I18N.pick(c.short)}`).join(' · ');
        let html = `<div class="free-banner">🎁 <strong>${I18N.t('freeChapterTag')}</strong>${I18N.t('sep')}${freeList}</div>`;
        D.PRODUCTS.filter(p => p.category === 'chapters').forEach(p => {
          const owned = isProductOwned(p, st);
          html += `
            <div class="store-card ${p.featured ? 'featured' : ''}">
              <div class="sc-ico">${p.emoji}</div>
              <div class="sc-body">
                <div class="sc-head"><b>${I18N.pick(p.name)}</b> ${p.featured ? `<span class="badge paid">${I18N.t('bundleSavings')}</span>` : ''}</div>
                <p>${I18N.pick(p.desc)}</p>
              </div>
              <div class="sc-act">
                ${owned
                  ? `<span class="badge owned">✅ ${I18N.t('storeOwned')}</span>`
                  : `<button class="sm-btn gold" data-watch-ad="${p.id}" ${adBusy ? 'disabled' : ''}>${adBtnLabel(p, st)}</button>`}
              </div>
            </div>`;
        });
        grid.innerHTML = html;
      } else if (storeTab === 'heroes') {
        grid.innerHTML = D.HEROES.map(h => {
          const owned = st.unlockedHeroes.includes(h.id);
          const equipped = st.heroId === h.id;
          let actBtn = '';
          if (equipped) actBtn = `<span class="badge owned">⭐ ${I18N.t('storeEquipped')}</span>`;
          else if (owned) actBtn = `<button class="sm-btn primary" data-equip-hero="${h.id}">${I18N.t('storeEquip')}</button>`;
          else if (h.goldPrice) actBtn = `<button class="sm-btn primary" data-buy-hero-gold="${h.id}">${I18N.t('storeBuyGold', { price: h.goldPrice })}</button>`;
          else {
            const prod = D.PRODUCT_BY_ID[h.productId];
            actBtn = `<button class="sm-btn gold" data-watch-ad="${prod.id}" ${adBusy ? 'disabled' : ''}>${adBtnLabel(prod, st)}</button>`;
          }
          return `
            <div class="store-card">
              <img class="sc-img" src="${Art.getHeroPortrait(h.id)}" alt="">
              <div class="sc-body">
                <div class="sc-head"><b>${I18N.pick(h.name)}</b></div>
                <p class="perk-txt">✨ ${I18N.t('perk')}${I18N.t('sep')}${I18N.pick(h.perkDesc)}</p>
              </div>
              <div class="sc-act">${actBtn}</div>
            </div>`;
        }).join('');
      } else if (storeTab === 'tools') {
        grid.innerHTML = D.TOOLS.map(tl => {
          const owned = st.tools.includes(tl.id);
          let actHtml = '';
          if (owned) {
            actHtml = `<span class="badge owned">✅ ${I18N.t('storeOwned')}</span>`;
          } else {
            const btns = [];
            if (tl.goldPrice) btns.push(`<button class="sm-btn primary" data-buy-tool-gold="${tl.id}">${I18N.t('storeBuyGold', { price: tl.goldPrice })}</button>`);
            if (tl.productId) {
              const prod = D.PRODUCT_BY_ID[tl.productId];
              btns.push(`<button class="sm-btn gold" data-watch-ad="${prod.id}" ${adBusy ? 'disabled' : ''}>${adBtnLabel(prod, st)}</button>`);
            }
            actHtml = btns.join('');
          }
          return `
            <div class="store-card">
              <div class="sc-ico">${tl.emoji}</div>
              <div class="sc-body">
                <div class="sc-head"><b>${I18N.pick(tl.name)}</b></div>
                <p>${I18N.pick(tl.desc)}</p>
              </div>
              <div class="sc-act">${actHtml}</div>
            </div>`;
        }).join('');
      } else {
        const adPack = D.PRODUCT_BY_ID.ad_supply_pack;
        let html = `
          <div class="store-card featured">
            <div class="sc-ico">${adPack.emoji}</div>
            <div class="sc-body">
              <div class="sc-head"><b>${I18N.pick(adPack.name)}</b> <span class="badge free">${I18N.t('chapterFree')}</span></div>
              <p>${I18N.pick(adPack.desc)}</p>
            </div>
            <div class="sc-act">
              <button class="sm-btn gold" data-watch-ad="${adPack.id}" ${adBusy ? 'disabled' : ''}>${adBtnLabel(adPack, st)}</button>
            </div>
          </div>`;
        html += D.SUPPLIES.map(sp => `
          <div class="store-card">
            <div class="sc-ico">${sp.emoji}</div>
            <div class="sc-body">
              <div class="sc-head"><b>${I18N.pick(sp.name)}</b></div>
              <p>${I18N.pick(sp.desc)}</p>
            </div>
            <div class="sc-act">
              <button class="sm-btn primary" data-buy-supply="${sp.id}">${I18N.t('storeBuyGold', { price: sp.price })}</button>
            </div>
          </div>`).join('');
        grid.innerHTML = html;
      }

      // Bind Rewarded Video Ad actions
      grid.querySelectorAll('[data-watch-ad]').forEach(btn => {
        btn.onclick = () => {
          const prod = D.PRODUCT_BY_ID[btn.dataset.watchAd];
          if (!prod) return;
          triggerAdUnlock(prod, () => openStore(storeTab), btn);
        };
      });
      grid.querySelectorAll('[data-buy-hero-gold]').forEach(btn => {
        btn.onclick = () => {
          const h = D.HERO_BY_ID[btn.dataset.buyHeroGold];
          if (gameRef.buyHeroWithGold(h)) openStore('heroes');
        };
      });
      grid.querySelectorAll('[data-equip-hero]').forEach(btn => {
        btn.onclick = () => {
          gameRef.equipHero(btn.dataset.equipHero);
          openStore('heroes');
        };
      });
      grid.querySelectorAll('[data-buy-tool-gold]').forEach(btn => {
        btn.onclick = () => {
          const tl = D.TOOL_BY_ID[btn.dataset.buyToolGold];
          if (gameRef.buyToolWithGold(tl)) openStore('tools');
        };
      });
      grid.querySelectorAll('[data-buy-supply]').forEach(btn => {
        btn.onclick = () => {
          const sp = D.SUPPLIES.find(x => x.id === btn.dataset.buySupply);
          gameRef.buySupplyWithGold(sp);
        };
      });
    }, { type: 'store' });
  }

  function triggerAdUnlock(prod, onAfter, btnEl) {
    if (Platform.isRewardedAdInFlight()) {
      AudioFX.sfx.locked();
      gameRef.toast(I18N.t('adBusyToast'));
      return false;
    }
    if (btnEl) {
      btnEl.disabled = true;
      btnEl.textContent = I18N.t('storeAdLoading');
    }
    return Platform.showRewardedAd(
      prod,
      () => {
        gameRef.recordAdProgress(prod);
        if (onAfter) onAfter();
      },
      reason => {
        AudioFX.sfx.locked();
        if (reason === 'ad_unavailable' || reason === 'ad_create_error' || reason === 'ad_show_error' || reason === 'ad_error') {
          gameRef.toast(I18N.t('adUnavailableToast'));
        } else if (reason === 'busy') {
          gameRef.toast(I18N.t('adBusyToast'));
        } else {
          gameRef.toast(I18N.t('adIncompleteToast'));
        }
        if (onAfter) onAfter();
      },
      openSimulatedAdModal
    );
  }

  /* ---------------- Sandbox Rewarded Video Ad Player Modal ---------------- */
  function openSimulatedAdModal(prod, onComplete, onSkip) {
    const st = gameRef.getState();
    const done = prod.repeatable ? 0 : getEffectiveAdProgress(prod, st);
    pendingAdCancel = onSkip;
    openModal(I18N.t('adPlayerTitle'), `
      <div class="checkout-box">
        <div class="co-emoji">🎬 ${prod.emoji}</div>
        <h3>${I18N.pick(prod.name)}</h3>
        <p>${I18N.pick(prod.desc)}</p>
        <div class="co-price">${Math.min(prod.adCost, done + 1)} / ${prod.adCost} <span>🎬</span></div>
        <div class="co-note">${I18N.t('checkoutBridge')} (${Platform.getEnvName()})</div>
        <div class="co-btns">
          <button class="big-btn green" id="adConfirm">${I18N.t('adPlayerConfirm')}</button>
          <button class="big-btn ghost" id="adSkip">${I18N.t('adPlayerSkip')}</button>
        </div>
      </div>
    `, body => {
      const confirmBtn = body.querySelector('#adConfirm');
      const skipBtn = body.querySelector('#adSkip');
      if (confirmBtn) {
        confirmBtn.onclick = () => {
          pendingAdCancel = null;
          onComplete();
        };
      }
      if (skipBtn) {
        skipBtn.onclick = () => {
          pendingAdCancel = null;
          onSkip('incomplete');
        };
      }
    }, { type: 'simAd', arg: { prod, onComplete, onSkip } });
  }

  /* ---------------- Chapter Gate Locked Preview Modal ---------------- */
  function openGateLockModal(chapterId) {
    const D = getD();
    const ch = D.getChapter(chapterId);
    const prod = D.PRODUCT_BY_ID[ch.productId];
    const st = gameRef.getState();
    const done = getEffectiveAdProgress(prod, st);
    const adBusy = Platform.isRewardedAdInFlight();
    openModal(I18N.t('gateLockedTitle'), `
      <div class="checkout-box">
        <div class="co-emoji">${ch.emoji}</div>
        <h3>${I18N.t('chapterPrefix', { n: ch.id })} · ${I18N.pick(ch.name)}</h3>
        <p>${I18N.t('gateLockedDesc', { chName: I18N.pick(ch.name), cost: ch.adCost, done })}</p>
        <div class="co-price">🎬 ${done} / ${ch.adCost}</div>
        <div class="co-btns">
          <button class="big-btn gold" id="gateWatchAd" ${adBusy ? 'disabled' : ''}>${adBtnLabel(prod, st)}</button>
          <button class="big-btn primary" id="gateOpenStore">👑 ${I18N.t('storeTitle')}</button>
          <button class="big-btn ghost" id="gateClose">${I18N.t('notNowBtn')}</button>
        </div>
      </div>
    `, body => {
      const watchBtn = body.querySelector('#gateWatchAd');
      if (watchBtn) {
        watchBtn.onclick = () => {
          triggerAdUnlock(prod, () => {
            if (st.unlockedChapters.includes(chapterId)) closeModal();
            else openGateLockModal(chapterId);
          }, watchBtn);
        };
      }
      const storeBtn = body.querySelector('#gateOpenStore');
      if (storeBtn) storeBtn.onclick = () => { storeTab = 'chapters'; openStore('chapters'); };
      const closeBtn = body.querySelector('#gateClose');
      if (closeBtn) closeBtn.onclick = closeModal;
    }, { type: 'gate', arg: chapterId });
  }

  /* ---------------- 3. Critterdex (25 Original Critters by Chapter) ---------------- */
  function openDex() {
    const D = getD();
    const st = gameRef.getState();
    const sections = D.CHAPTERS.map(ch => {
      const list = D.CRITTERS.filter(c => c.chapter === ch.id);
      const unlocked = st.unlockedChapters.includes(ch.id);
      const chBadge = ch.free
        ? `<span class="badge free">${I18N.t('chapterFree')}</span>`
        : unlocked
          ? `<span class="badge owned">${I18N.t('chapterUnlocked')}</span>`
          : `<span class="badge paid">${I18N.t('chapterPaid')}</span>`;
      const cards = list.map(c => {
        const caught = st.caughtIds.includes(c.id);
        return `
          <div class="dex-card ${caught ? 'caught' : 'unseen'}">
            <img src="${Art.getCritterPortrait(c.id)}" alt="">
            <div class="dex-name">${caught ? I18N.pick(c.name) : '???'}</div>
            <div class="dex-meta">
              <span class="elem-tag ${c.elem}">${I18N.t('elemNames')[c.elem]}</span>
              ${c.boss ? '<span class="boss-tag">👑</span>' : ''}
            </div>
            <div class="dex-desc">${caught ? I18N.pick(c.desc) : I18N.t('unseenTag')}</div>
          </div>`;
      }).join('');
      return `
        <h3 class="sec-h">${ch.emoji} ${I18N.t('chapterPrefix', { n: ch.id })} · ${I18N.pick(ch.short)} ${chBadge}</h3>
        <div class="dex-grid">${cards}</div>`;
    }).join('');

    openModal(`📖 ${I18N.t('dex')} (${st.caughtIds.length}/${D.CRITTERS.length})`, sections, null, { type: 'dex' });
  }

  /* ---------------- 4. Party, Crests & Active Hero ---------------- */
  function openParty() {
    const D = getD();
    const st = gameRef.getState();
    const hero = D.HERO_BY_ID[st.heroId] || D.HEROES[0];
    const crestsHtml = D.CHAPTERS.map(ch => {
      const has = st.crests.includes(ch.id);

    }).join('');

    const partyHtml = st.party.map((p, idx) => {
      const cr = D.CRITTER_BY_ID[p.id];
      const active = idx === st.activePartnerIdx;
      const hpPct = Math.round((p.hp / p.maxHp) * 100);
      return `
        <div class="store-card ${active ? 'featured' : ''}">
          <img class="sc-img" src="${Art.getCritterPortrait(p.id)}" alt="">
          <div class="sc-body">
            <div class="sc-head"><b>${I18N.pick(cr.name)}</b> <span class="badge free">Lv.${p.lv}</span></div>
            <div class="mini-bar"><i style="width:${hpPct}%"></i></div>
            <p>HP ${p.hp}/${p.maxHp} · ${I18N.pick(cr.skill)}</p>
          </div>
          <div class="sc-act">
            ${active ? `<span class="badge owned">⭐ ${I18N.t('activePartner')}</span>` : `<button class="sm-btn primary" data-set-p="${idx}">${I18N.t('setPartner')}</button>`}
          </div>
        </div>`;

      <div class="crest-bar"><strong>🏆 ${I18N.t('crestsLabel')} (${st.crests.length}/5)${I18N.t('sep')}</strong> ${crestsHtml}</div>
      <div class="store-card">
        <img class="sc-img" src="${Art.getHeroPortrait(hero.id)}" alt="">
        <div class="sc-body">
          <div class="sc-head"><b>${I18N.pick(hero.name)}</b> <span class="badge owned">${I18N.t('activeHero')}</span></div>
          <p class="perk-txt">✨ ${I18N.pick(hero.perkDesc)}</p>
        </div>
        <div class="sc-act"><button class="sm-btn gold" id="switchHeroBtn">${I18N.t('storeTabHeroes')}</button></div>
      </div>
      <h3 class="sec-h">🐾 ${I18N.t('party')} (${st.party.length})</h3>
      <div class="store-grid">${partyHtml}</div>
    `, body => {
      const swBtn = body.querySelector('#switchHeroBtn');
      if (swBtn) swBtn.onclick = () => openStore('heroes');
      body.querySelectorAll('[data-set-p]').forEach(btn => {
        btn.onclick = () => {
          st.activePartnerIdx = parseInt(btn.dataset.setP, 10);
          AudioFX.sfx.tap();
          gameRef.saveAndSync();
          openParty();
        };
      });
    }, { type: 'party' });
  }

    [1, 2, 3].forEach(c => { if (!unlockedChapters.includes(c)) unlockedChapters.push(c); });

    if (!unlockedHeroes.includes('ranger')) unlockedHeroes.unshift('ranger');

      tools,

      caughtIds,

      claimedNpcs,
      defeatedBosses,

      adViewsTotal: clampInt(raw.adViewsTotal, 0, 99999, 0),

    const snap = snapshotState();
    applyProductGrants(prod);
    if (!saveAndSync()) {
      restoreSnapshot(snap);
      syncHud();
      AudioFX.sfx.locked();
      toast(I18N.t('saveFailedToast'));
      return false;
    }
    AudioFX.sfx.unlock();
    Platform.vibrateShort();
    toast(I18N.t('unlockedToast', { name: I18N.pick(prod.name) }));
    spawnBurst(player.x, player.y, '#fde047', 24);
    return true;
  }

  function recordAdProgress(prod) {
    const snap = snapshotState();
    state.adViewsTotal = (state.adViewsTotal || 0) + 1;
    if (prod.repeatable) {
      applyProductGrants(prod);
      if (!saveAndSync()) {
        restoreSnapshot(snap);
        syncHud();
        AudioFX.sfx.locked();
        toast(I18N.t('saveFailedToast'));
        return false;
      }
      AudioFX.sfx.unlock();
      Platform.vibrateShort();
      toast(I18N.t('unlockedToast', { name: I18N.pick(prod.name) }));
      spawnBurst(player.x, player.y, '#fde047', 24);
      return true;
    }

    state.adProgress = state.adProgress || {};
    state.adProgress[prod.id] = (state.adProgress[prod.id] || 0) + 1;
    const done = UI.getEffectiveAdProgress(prod, state);
    const unlockedNow = done >= (prod.adCost || 1);
    if (unlockedNow) applyProductGrants(prod);

    if (!saveAndSync()) {
      restoreSnapshot(snap);
      syncHud();
      AudioFX.sfx.locked();
      toast(I18N.t('saveFailedToast'));
      return false;
    }

    if (unlockedNow) {
      AudioFX.sfx.unlock();
      Platform.vibrateShort();
      toast(I18N.t('unlockedToast', { name: I18N.pick(prod.name) }));
      spawnBurst(player.x, player.y, '#fde047', 24);
    } else {
      AudioFX.sfx.tap();
      toast(I18N.t('adProgressToast', { done, cost: prod.adCost }));
    }
    return true;
  }

  /* ---------------- Chapter Detection, Fast Travel & Compass ---------------- */
  function updateChapterContext(playMusic) {
    const D = getD();
    const m = World.getMap();
    const chId = m.isDungeon ? m.chapterId : World.getZ(m, Math.round(player.x), Math.round(player.y));
    const ch = D.getChapter(chId);
    const changed = chId !== currentChapterId;
    currentChapterId = chId;

    const banner = $('chapterBanner');
    if (banner) {
      if (m.isDungeon) {
        banner.textContent = `🌀 ${I18N.pick(ch.dungeon.name)} · ${I18N.t('chapterPrefix', { n: ch.id })}`;
      } else {
        banner.textContent = `${ch.emoji} ${I18N.t('chapterPrefix', { n: ch.id })} · ${I18N.pick(ch.name)}`;
      }
    }
    if (playMusic || changed) {
      AudioFX.playBgm(m.isDungeon ? 'dungeon' : ch.bgm);
    }
  }

  function warpToChapter(chapterId) {
    const D = getD();
    if (!state.unlockedChapters.includes(chapterId)) {
      UI.openGateLockModal(chapterId);
      return false;
    }
    if (!state.tools.includes('wings')) {
      AudioFX.sfx.locked();
      toast(I18N.t('fastTravelLocked'));
      UI.openStore('tools');
      return false;
    }
    const ch = D.getChapter(chapterId);
    World.setActiveMap('overworld');
    player.x = player.tx = ch.waystone.x;
    player.y = player.ty = ch.waystone.y + 1;
    player.owX = player.x;
    player.owY = player.y;
    player.moving = false;
    AudioFX.sfx.warp();
    spawnBurst(player.x, player.y, '#38bdf8', 22);
    toast(I18N.t('fastTravelDone', { name: I18N.pick(ch.name) }));
    updateChapterContext(true);
    saveAndSync();
    return true;
  }

  function updateCompass() {
    const bar = $('compassBar');
    if (!bar) return;
    if (!state || !state.tools.includes('compass')) {
      bar.classList.add('hidden');
      return;
    }
    bar.classList.remove('hidden');
    const m = World.getMap();
    let best = null, bestDist = Infinity;
    m.chests.forEach(c => {
      if (state.openedChests.includes(c.id)) return;
      if (!m.isDungeon && !state.unlockedChapters.includes(c.chapter)) return;
      const dist = Math.hypot(c.x - player.x, c.y - player.y);
      if (dist < bestDist) { bestDist = dist; best = { x: c.x, y: c.y, label: I18N.getLang() === 'zh' ? '宝箱' : 'Chest' }; }
    });
    if (!best) {
      bar.textContent = `🧭 ${I18N.t('compassNone')}`;
      return;
    }
    const dx = best.x - player.x, dy = best.y - player.y;
    const dirs = ['➡️', '↘️', '⬇️', '↙️', '⬅️', '↖️', '⬆️', '↗️'];
    const idx = Math.round(((Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2)) / (Math.PI / 4)) % 8;
    bar.textContent = `🧭 ${dirs[idx]} ${I18N.t('compassNearest', { target: best.label, dist: Math.round(bestDist) })}`;
  }

  /* ---------------- Movement & Interaction ---------------- */
  function getMoveInput() {
    if (dpadDir) return dpadDir;
    if (keys.ArrowUp || keys.KeyW) return 'up';
    if (keys.ArrowDown || keys.KeyS) return 'down';
    if (keys.ArrowLeft || keys.KeyA) return 'left';
    if (keys.ArrowRight || keys.KeyD) return 'right';
    return null;
  }

  function dirDelta(dir) {
    if (dir === 'up') return [0, -1];
    if (dir === 'down') return [0, 1];
    if (dir === 'left') return [-1, 0];
    if (dir === 'right') return [1, 0];
    return [0, 0];
  }

  function tryStep(dir) {
    player.dir = dir;
    const [dx, dy] = dirDelta(dir);
    const nx = Math.round(player.x) + dx;
    const ny = Math.round(player.y) + dy;
    const check = World.isWalkable(nx, ny, state);
    if (!check.ok) {
      if (check.reason === 'gate' && nowMs() - lastGateWarn > 1400) {
        lastGateWarn = nowMs();
        AudioFX.sfx.locked();
        UI.openGateLockModal(check.chapter);
      } else if (check.reason === 'water' && nowMs() - lastGateWarn > 2200) {
        lastGateWarn = nowMs();
        toast(I18N.t('waterBlocked'));
      }
      return false;
    }
    player.tx = nx;
    player.ty = ny;
    player.moving = true;
    AudioFX.sfx.step();
    return true;
  }

  function onStepComplete() {
    const m = World.getMap();
    const px = Math.round(player.x), py = Math.round(player.y);
    updateChapterContext(false);
    updateCompass();

    const obj = World.hasObjAt(m, px, py);
    if (obj && obj.action === 'enter_dungeon') {
      player.owX = px;
      player.owY = py + 1;
      World.setActiveMap(obj.data.dungeonId);
      player.x = player.tx = 11;
      player.y = player.ty = 13;
      player.dir = 'up';
      AudioFX.sfx.warp();
      toast(`🌀 ${I18N.pick(obj.label)}`);
      updateChapterContext(true);
      saveAndSync();
      return;
    }
    if (obj && obj.action === 'exit_dungeon') {
      World.setActiveMap('overworld');
      player.x = player.tx = obj.data.tx;
      player.y = player.ty = obj.data.ty;
      player.dir = 'down';
      AudioFX.sfx.warp();
      Platform.showInterstitialAd();
      updateChapterContext(true);
      saveAndSync();
      return;
    }

    const tile = World.getT(m, px, py);
    if (tile === World.T.TALL) {
      player.stepsSinceEncounter++;
      if (player.stepsSinceEncounter >= 4 && Math.random() < 0.24) {
        player.stepsSinceEncounter = 0;
        triggerWildEncounter();
      }
    }
  }

  function isOverlayOpen() {
    const modal = $('modal');
    const cele = $('celebrate');
    return (modal && !modal.classList.contains('hidden')) || (cele && !cele.classList.contains('hidden'));
  }

  function interact() {
    if (dialogOpen) { closeDialog(false); return; }
    if (!running || Battle.isActive() || isOverlayOpen()) return;

    const D = getD();
    const m = World.getMap();
    const px = Math.round(player.x), py = Math.round(player.y);
    const [dx, dy] = dirDelta(player.dir);
    const targets = [[px + dx, py + dy], [px, py]];

    for (let i = 0; i < targets.length; i++) {
      const [tx, ty] = targets[i];

      if (m.boss && m.boss.x === tx && m.boss.y === ty) {
        const cr = D.CRITTER_BY_ID[m.boss.critterId];
        showDialog(I18N.pick(cr.name), '👑', I18N.pick(cr.desc), () => {
          startBattle(m.boss.critterId, m.boss.lv, true, m.boss.chapter);
        });
        return;
      }

      const chest = World.hasChestAt(m, tx, ty);
      if (chest) {
        if (state.openedChests.includes(chest.id)) {
          toast(I18N.t('chestEmpty'));
          return;
        }
        state.openedChests.push(chest.id);
        const parts = [];
        const goldMult = state.tools.includes('magnet') ? 1.35 : 1;
        Object.keys(chest.loot).forEach(k => {
          let amt = chest.loot[k];
          if (k === 'gold') { amt = Math.round(amt * goldMult); state.gold += amt; parts.push(`${amt} 🪙`); }
          else {
            state.items[k] = (state.items[k] || 0) + amt;
            const ico = k === 'orbs' ? '🔵' : k === 'superOrbs' ? '🌈' : k === 'masterOrbs' ? '👑' : '🍓';
            parts.push(`${amt} ${ico}`);
          }
        });
        AudioFX.sfx.chest();
        Platform.vibrateShort();
        spawnBurst(tx, ty, '#facc15', 22);
        toast(I18N.t('chestFound', { loot: parts.join(' + ') }));
        saveAndSync();
        return;
      }

      const npc = World.hasNpcAt(m, tx, ty);
      if (npc) {
        AudioFX.sfx.tap();
        showDialog(I18N.pick(npc.name), '🗣️', I18N.pick(npc.lines), () => {
          if (npc.gift && !state.claimedNpcs.includes(npc.id)) {
            state.claimedNpcs.push(npc.id);
            const parts = [];
            Object.keys(npc.gift).forEach(k => {
              const amt = npc.gift[k];
              if (k === 'gold') { state.gold += amt; parts.push(`${amt} 🪙`); }
              else { state.items[k] = (state.items[k] || 0) + amt; parts.push(`${amt}×${k === 'orbs' ? '🔵' : k === 'superOrbs' ? '🌈' : k === 'masterOrbs' ? '👑' : '🍓'}`); }
            });
            AudioFX.sfx.chest();
            toast(`🎁 ${parts.join(' + ')}`);
            saveAndSync();
          }
          if (npc.questTool && !state.tools.includes(npc.questTool)) {
            state.tools.push(npc.questTool);
            const tl = D.TOOL_BY_ID[npc.questTool];
            AudioFX.sfx.unlock();
            toast(I18N.t('unlockedToast', { name: `${tl.emoji} ${I18N.pick(tl.name)}` }));
            saveAndSync();
          }
          if (npc.role === 'shop') UI.openStore('chapters');
          if (npc.role === 'gate4' && !state.unlockedChapters.includes(4)) UI.openGateLockModal(4);
          if (npc.role === 'gate5' && !state.unlockedChapters.includes(5)) UI.openGateLockModal(5);
        });
        return;
      }

      const obj = World.hasObjAt(m, tx, ty);
      if (obj && obj.action) {
        if (obj.action === 'heal') {
          state.party.forEach(p => { p.hp = p.maxHp; });
          AudioFX.sfx.heal();
          spawnBurst(player.x, player.y, '#38bdf8', 22);
          toast(I18N.t('healMsg'));
          saveAndSync();
          return;
        }
        if (obj.action === 'shop') { UI.openStore('chapters'); return; }
        if (obj.action === 'waystone') { UI.openWorldMap(); return; }
        if (obj.action === 'sign') { showDialog('🪧', '🪧', I18N.pick(obj.data.text)); return; }
      }

      const tile = World.getT(m, tx, ty);
      if (tile === World.T.GATE_CH4 && !state.unlockedChapters.includes(4)) { UI.openGateLockModal(4); return; }
      if (tile === World.T.GATE_CH5 && !state.unlockedChapters.includes(5)) { UI.openGateLockModal(5); return; }
    }
  }

  /* ---------------- Battles & Capture Celebration ---------------- */
  function triggerWildEncounter() {
    const D = getD();
    const m = World.getMap();
    const ch = D.getChapter(currentChapterId);
    const pool = m.isDungeon ? ch.dungeon.wildPool : ch.wildPool;
    const hasLantern = state.tools.includes('lantern');

    const weights = pool.map(id => {
      const r = D.CRITTER_BY_ID[id].rarity;
      if (r === 'epic') return hasLantern ? 2.4 : 1.0;
      if (r === 'rare') return hasLantern ? 2.8 : 1.4;
      return 2.4;
    });
    const sum = weights.reduce((a, b) => a + b, 0);
    let pick = Math.random() * sum;
    let chosenId = pool[0];
    for (let i = 0; i < pool.length; i++) {
      pick -= weights[i];
      if (pick <= 0) { chosenId = pool[i]; break; }
    }
    const [minLv, maxLv] = ch.lvRange;
    const lv = minLv + Math.floor(Math.random() * (maxLv - minLv + 1)) + (m.isDungeon ? 2 : 0);
    startBattle(chosenId, lv, false, ch.id);
  }

  function startBattle(critterId, lv, isBoss, chId) {
    const D = getD();
    player.moving = false;
    Battle.start(state, critterId, lv, isBoss, chId, res => {
      if (res.result === 'fainted') {
        const ch = D.getChapter(currentChapterId);
        state.party.forEach(p => { p.hp = p.maxHp; });
        World.setActiveMap('overworld');
        player.x = player.tx = ch.healSpot.x;
        player.y = player.ty = ch.healSpot.y + 1;
        player.owX = player.x;
        player.owY = player.y;
        toast(I18N.t('battleAllFainted'));
      } else if (res.result === 'caught') {
        addCaughtCritter(res.critterId, res.lv);
      }
      if ((res.result === 'win' || res.result === 'caught') && res.isBoss) {
        const ch = D.getChapter(res.chapterId);
        state.defeatedBosses = state.defeatedBosses || [];
        if (!state.defeatedBosses.includes(ch.id)) state.defeatedBosses.push(ch.id);
        if (!state.crests.includes(ch.id)) {
          state.crests.push(ch.id);
          AudioFX.sfx.unlock();
          toast(I18N.t('crestEarned', { name: `${ch.crest.emoji} ${I18N.pick(ch.crest)}` }));
        }
      }
      updateChapterContext(true);
      saveAndSync();
    });
  }

  function renderCelebrateOverlay(critterId, lv) {
    const D = getD();
    const cr = D.CRITTER_BY_ID[critterId];
    if (!cr) return;
    const setTxt = (id, t) => { const el = $(id); if (el) el.textContent = t; };
    setTxt('celeTitle', I18N.t('gotchaTitle'));
    const img = $('celeImg');
    if (img) img.src = Art.getCritterPortrait(critterId);
    setTxt('celeName', `${I18N.pick(cr.name)} (Lv.${lv})`);
    setTxt('celeDesc', I18N.pick(cr.desc));
    setTxt('celeOk', I18N.t('gotchaOk'));
    setTxt('celePartner', I18N.t('gotchaPartner'));
  }

  function addCaughtCritter(critterId, lv) {
    if (!state.caughtIds.includes(critterId)) state.caughtIds.push(critterId);
    const existing = state.party.find(p => p.id === critterId);
    let newIdx = state.party.length;
    if (!existing) {
      const st = Battle.calcStats(critterId, lv, true, state);
      state.party.push({ id: critterId, lv, hp: st.maxHp, maxHp: st.maxHp, exp: 0 });
    } else {
      newIdx = state.party.indexOf(existing);
      existing.lv = Math.max(existing.lv, lv);
      const st = Battle.calcStats(critterId, existing.lv, true, state);
      existing.maxHp = st.maxHp;
      existing.hp = st.maxHp;
    }
    lastCaughtSpec = { id: critterId, lv };
    renderCelebrateOverlay(critterId, lv);
    const cele = $('celebrate');
    if (cele) cele.classList.remove('hidden');
    const okBtn = $('celeOk');
    if (okBtn) okBtn.onclick = () => { if (cele) cele.classList.add('hidden'); };
    const partnerBtn = $('celePartner');
    if (partnerBtn) {
      partnerBtn.onclick = () => {
        state.activePartnerIdx = newIdx;
        saveAndSync();
        if (cele) cele.classList.add('hidden');
      };
    }
  }

  /* ---------------- Particles & Ambient Weather ---------------- */
  function spawnBurst(tx, ty, color, n) {
    for (let i = 0; i < (n || 12); i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.04 + Math.random() * 0.09;
      particles.push({ x: tx + 0.5, y: ty + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color, r: 3 + Math.random() * 3 });
    }
  }

  function initAmbient() {
    ambient = [];
    for (let i = 0; i < 36; i++) {
      ambient.push({ x: Math.random(), y: Math.random(), sp: 0.08 + Math.random() * 0.16, ph: Math.random() * 6.28 });
    }
  }

  /* ---------------- Main 60fps Game & Render Loop ---------------- */
  function loop() {
    time += 0.016;
    if (running && !Battle.isActive() && !isOverlayOpen()) {
      updateMovement();
    }
    if (running && !Battle.isActive()) {
      renderWorld();
    }
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }

  function updateMovement() {
    if (dialogOpen) return;
    if (!player.moving) {
      const dir = getMoveInput();
      if (dir) tryStep(dir);
    }
    if (player.moving) {
      let speed = 0.11;
      const dashing = (dashHeld || keys.ShiftLeft || keys.ShiftRight || keys.KeyX) && state.tools.includes('boots');
      if (dashing) speed *= 1.62;
      if (state.tools.includes('wings')) speed *= 1.18;

      const dx = player.tx - player.x;
      const dy = player.ty - player.y;
      const dist = Math.hypot(dx, dy);
      player.walkPhase += speed * 2.2;
      if (dashing && Math.random() < 0.45) {
        particles.push({ x: player.x + 0.5, y: player.y + 0.8, vx: (Math.random() - 0.5) * 0.03, vy: -0.02, life: 0.7, color: '#86efac', r: 3 });
      }
      if (dist <= speed) {
        player.x = player.tx;
        player.y = player.ty;
        player.moving = false;
        onStepComplete();
      } else {
        player.x += (dx / dist) * speed;
        player.y += (dy / dist) * speed;
      }
    }
  }

  function renderWorld() {
    const cv = $('world');
    if (!cv || typeof cv.getContext !== 'function') return;
    const c = cv.getContext('2d');
    if (!c) return;
    const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
    const vw = (typeof window !== 'undefined' && window.innerWidth) || 800;
    const vh = (typeof window !== 'undefined' && window.innerHeight) || 600;
    if (cv.width !== vw * dpr || cv.height !== vh * dpr) {
      cv.width = vw * dpr; cv.height = vh * dpr;
    }

    const S = Math.max(32, Math.min(48, Math.round(Math.min(vw, vh) / 13)));
    const m = World.getMap();
    const camX = player.x * S - vw * 0.5 + S * 0.5;
    const camY = player.y * S - vh * 0.5 + S * 0.5;

    c.save();
    c.scale(dpr, dpr);
    c.fillStyle = currentChapterId === 5 ? '#1b1440' : '#0f172a';
    c.fillRect(0, 0, vw, vh);

    const x0 = Math.max(0, Math.floor(camX / S) - 1);
    const y0 = Math.max(0, Math.floor(camY / S) - 1);
    const x1 = Math.min(m.w - 1, Math.ceil((camX + vw) / S) + 1);
    const y1 = Math.min(m.h - 1, Math.ceil((camY + vh) / S) + 1);

    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const px = Math.floor(x * S - camX);
        const py = Math.floor(y * S - camY);
        Art.drawTile(c, World.getT(m, x, y), World.getZ(m, x, y), m.decals[y * m.w + x], px, py, S, time, state.unlockedChapters);
      }
    }

    m.objects.forEach(o => {
      if (o.x + (o.w || 1) < x0 || o.x > x1 || o.y + (o.h || 1) < y0 || o.y > y1) return;
      Art.drawObject(c, o, Math.floor(o.x * S - camX), Math.floor(o.y * S - camY), S, time);
    });

    m.chests.forEach(ch => {
      if (ch.x < x0 || ch.x > x1 || ch.y < y0 || ch.y > y1) return;
      Art.drawChest(c, state.openedChests.includes(ch.id), Math.floor(ch.x * S - camX), Math.floor(ch.y * S - camY), S, time);
    });

    m.npcs.forEach(n => {
      if (n.x < x0 || n.x > x1 || n.y < y0 || n.y > y1) return;
      const hasGift = (n.gift && !state.claimedNpcs.includes(n.id)) || (n.questTool && !state.tools.includes(n.questTool));
      Art.drawNpc(c, n, Math.floor(n.x * S - camX), Math.floor(n.y * S - camY), S, time, hasGift);
    });

    if (m.boss) {
      const bx = m.boss.x * S - camX + S * 0.5;
      const by = m.boss.y * S - camY + S * 0.45;
      Art.drawCritter(c, m.boss.critterId, bx, by, S * 2.1, time, false);
    }

    const curTile = World.getT(m, Math.round(player.x), Math.round(player.y));
    const isSurfing = curTile === World.T.SHALLOW;
    Art.drawHero(c, state.heroId, player.x * S - camX, player.y * S - camY, S, player.dir, player.walkPhase, time, state.tools, isSurfing);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.03;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      c.globalAlpha = p.life;
      c.fillStyle = p.color;
      c.beginPath(); c.arc(p.x * S - camX, p.y * S - camY, p.r, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;

    if (!m.isDungeon && (currentChapterId === 1 || currentChapterId === 4 || currentChapterId === 5)) {
      const col = currentChapterId === 4 ? 'rgba(255,255,255,0.85)' : currentChapterId === 5 ? 'rgba(254,240,138,0.8)' : 'rgba(255,220,235,0.75)';
      c.fillStyle = col;
      ambient.forEach(a => {
        a.y = (a.y + a.sp * 0.008) % 1;
        const ax = ((a.x + Math.sin(time + a.ph) * 0.02 + 1) % 1) * vw;
        const ay = a.y * vh;
        c.beginPath(); c.arc(ax, ay, currentChapterId === 4 ? 3 : 2.3, 0, Math.PI * 2); c.fill();
      });
    }

    c.restore();
  }

  /* ---------------- Input Binding (Keyboard + Touch D-Pad + Buttons) ---------------- */
  function bindInputs() {
    if (typeof window === 'undefined') return;
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (running && !dialogOpen && !Battle.isActive() && !isOverlayOpen() && !player.moving) {
        const keyDir = e.code === 'ArrowUp' || e.code === 'KeyW' ? 'up'
          : e.code === 'ArrowDown' || e.code === 'KeyS' ? 'down'
          : e.code === 'ArrowLeft' || e.code === 'KeyA' ? 'left'
          : e.code === 'ArrowRight' || e.code === 'KeyD' ? 'right' : null;
        if (keyDir) tryStep(keyDir);
      }
      if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyZ') {
        if (dialogOpen) {
          e.preventDefault();
          closeDialog(false); // Debounced (220ms) so double-Space never skips dialogs
        } else if (running && !Battle.isActive() && !isOverlayOpen()) {
          e.preventDefault();
          interact();
        }
      }
      if (e.code === 'Escape') {
        if (dialogOpen) closeDialog(true);
        else UI.closeModal();
      }
      if (Battle.isActive() && !Battle.isMenuOpen() && !Battle.isBusy()) {
        if (e.key === '1') Battle.handleAction('attack');
        if (e.key === '2') Battle.handleAction('catch');
        if (e.key === '3') Battle.handleAction('feed');
        if (e.key === '4') Battle.handleAction('switch');
      }
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    const dpad = $('dpad');
    if (dpad) {
      const calcDpad = e => {
        const rect = dpad.getBoundingClientRect();
        const pt = e.touches ? e.touches[0] : e;
        const dx = pt.clientX - (rect.left + rect.width / 2);
        const dy = pt.clientY - (rect.top + rect.height / 2);
        if (Math.hypot(dx, dy) < 10) { dpadDir = null; return; }
        dpadDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      };
      let dpadDown = false;
      dpad.addEventListener('pointerdown', e => { e.preventDefault(); AudioFX.ensure(); dpadDown = true; if (dpad.setPointerCapture) dpad.setPointerCapture(e.pointerId); calcDpad(e); });
      dpad.addEventListener('pointermove', e => { if (dpadDown) calcDpad(e); });
      const stopDpad = () => { dpadDown = false; dpadDir = null; };
      dpad.addEventListener('pointerup', stopDpad);
      dpad.addEventListener('pointercancel', stopDpad);
    }

    const btnA = $('btnA');
    if (btnA) btnA.addEventListener('pointerdown', e => { e.preventDefault(); AudioFX.ensure(); interact(); });
    const btnB = $('btnB');
    if (btnB) {
      btnB.addEventListener('pointerdown', e => { e.preventDefault(); AudioFX.ensure(); dashHeld = true; });
      const stopB = () => { dashHeld = false; };
      btnB.addEventListener('pointerup', stopB);
      btnB.addEventListener('pointerleave', stopB);
      btnB.addEventListener('pointercancel', stopB);
    }

    const dlg = $('dialog');
    if (dlg) dlg.addEventListener('click', () => closeDialog(false));

    const bindClick = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    bindClick('partnerCard', () => UI.openParty());
    bindClick('mapBtn', () => UI.openWorldMap());
    bindClick('dexBtn', () => UI.openDex());
    bindClick('bagBtn', () => UI.openBag());
    bindClick('shopBtn', () => UI.openStore('chapters'));
    bindClick('menuBtn', () => UI.openSettings());
    bindClick('langBtn', () => { I18N.toggleLang(); refreshLabels(); });
    bindClick('bLangBtn', () => { I18N.toggleLang(); refreshLabels(); });
    bindClick('muteBtn', () => { AudioFX.setMuted(!AudioFX.isMuted()); syncHud(); });

    const bActions = $('bActions');
    if (bActions) {
      bActions.querySelectorAll('[data-act]').forEach(btn => {
        btn.onclick = () => Battle.handleAction(btn.dataset.act);
      });
    }
  }

  function resetGame() {
    Platform.clearSave();
    AudioFX.stopBgm();
    running = false;
    state = null;
    renderTitleScreen();
  }

  if (typeof window !== 'undefined' && typeof document !== 'undefined' && typeof window.addEventListener === 'function') {
    window.addEventListener('DOMContentLoaded', init);
  }

  return {
    init,
    startGame,
    defaultState,
    sanitizeSave,
    getState,
    getPlayerPos,
    getOverworldPos,
    warpToChapter,
    startBattle,
    syncPartyStats,
    recordAdProgress,
    grantProduct,
    buyHeroWithGold,
    buyToolWithGold,
    buySupplyWithGold,
    equipHero,
    saveAndSync,
    refreshLabels,
    interact,
    tryStep,
    showDialog,
    closeDialog,
    resetGame,
  };
})();
if (typeof globalThis !== 'undefined') globalThis.Game = Game;
if (typeof module === 'object' && module.exports) module.exports = Game;

</script>
